pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

rootProject.name = 'health-guide-ai'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
    versionCatalogs {
        reactAndroidLibs {
            from(files("../node_modules/react-native/gradle/libs.versions.toml"))
        }
    }
}

// 1. Links all React Native npm packages (safe-area-context, async-storage, etc.)
apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle");
applyNativeModulesSettingsGradle(settings)

// 2. Links Expo modules
apply from: file("../node_modules/expo/scripts/autolinking.gradle");
useExpoModules()

include ':app'
includeBuild("../node_modules/@react-native/gradle-plugin")