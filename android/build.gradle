buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'
        kspVersion = findProperty('android.kspVersion') ?: '1.9.23-1.0.20'
        ndkVersion = "26.1.10909125"

        // Helper closures
        kotlinVersion = { -> "1.9.23" }
        getKotlinVersion = { -> "1.9.23" }
        kspVersion = { -> "1.9.23-1.0.20" }
        getKspVersion = { Object... args -> "1.9.23-1.0.20" }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
    classpath 'com.android.tools.build:gradle:8.3.0'
    classpath 'com.facebook.react:react-native-gradle-plugin'
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
}
}

// Global project configuration accessible by subprojects
ext {
    buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
    minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
    compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
    targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
    kotlinVersion = '1.9.24'
    kspVersion = '1.9.23-1.0.20'
    ndkVersion = "26.1.10909125"

    kotlinVersion = { -> "1.9.23" }
    getKotlinVersion = { -> "1.9.23" }
    kspVersion = { -> "1.9.23-1.0.20" }
    getKspVersion = { Object... args -> "1.9.23-1.0.20" }
}

// Define helper methods directly on Project script and subprojects
def getKspVersion(Object... args) {
    return '1.9.23-1.0.20'
}

def getKotlinVersion(Object... args) {
    return '1.9.23'
}

subprojects { subproject ->
    subproject.ext.set("kotlinVersion", "1.9.23")
    subproject.ext.set("kspVersion", "1.9.23-1.0.20")
    subproject.metaClass.kotlinVersion = { -> "1.9.23" }
    subproject.metaClass.getKotlinVersion = { Object... args -> "1.9.23" }
    subproject.metaClass.kspVersion = { -> "1.9.23-1.0.20" }
    subproject.metaClass.getKspVersion = { Object... args -> "1.9.23-1.0.20" }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.all {
    }
}